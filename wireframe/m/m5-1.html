<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonkage – Đăng nhập (M5.1)</title>
  <link rel="stylesheet" href="../assets/wf.css">
</head>
<body data-zone="M" data-page="M5.1">
  <main id="content">
    <div class="auth">
      <div class="callout callout-soft sm" id="next-box" hidden data-why="1">
        <span class="grow">Đăng nhập để tiếp tục. Xong sẽ quay về <strong id="next-label"></strong><span id="nfc-hint" hidden> (qua bước xác minh danh tính)</span>.</span>
      </div>
      <form class="card" id="login-form" data-why="2">
        <h1>Đăng nhập</h1>
        <div class="field"><label for="email">Email</label><input id="email" type="email" value="anh.minh@congty.com"></div>
        <div class="field">
          <div class="row-between"><label for="pass" class="strong">Mật khẩu</label><a href="m5-4.html" class="sm">Quên mật khẩu?</a></div>
          <input id="pass" type="password" value="12345678">
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Đăng nhập (giả lập)</button>
      </form>
      <p class="alt" data-why="3">Chưa có tài khoản? <a href="m5-2.html">Đăng ký</a></p>
    </div>
  </main>
  <aside class="wf-note" data-ref="AC-02.3">Cổng đăng nhập: nhận trang quay về (?next=) và thao tác đang dở; xác nhận tài khoản (M5.3) hoặc xác minh NFC (M6.4) trước nếu cần. Đăng nhập giả lập đặt vai Người mua.</aside>
  <script>
    (function () {
      var next = new URLSearchParams(location.search).get('next');
      var needsNfc = next && /m3-1|m3-4|m7-1/.test(next);
      if (next) {
        document.getElementById('next-box').hidden = false;
        document.getElementById('next-label').textContent = next;
        document.getElementById('nfc-hint').hidden = !needsNfc;
      }
      document.getElementById('login-form').addEventListener('submit', function (e) {
        e.preventDefault();
        try { localStorage.setItem('wf_role', 'buyer'); } catch (err) {}
        if (!next) { location.href = 'm1-0.html'; return; }
        location.href = needsNfc ? 'm6-4.html?next=' + encodeURIComponent(next) : next;
      });
    })();
  </script>
  <script src="../assets/data.js"></script>
  <script src="../assets/why-m.js"></script>
  <script src="../assets/wf.js"></script>
</body>
</html>
