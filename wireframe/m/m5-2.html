<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonkage – Đăng ký tài khoản (M5.2)</title>
  <link rel="stylesheet" href="../assets/wf.css">
</head>
<body data-zone="M" data-page="M5.2">
  <main id="content">
    <div style="max-width: 440px; margin: 32px auto; border: 2px solid #000; padding: 24px; background: #fafafa;">
      <h1>Đăng ký tài khoản Moonkage</h1>
      <p style="color: #555; margin-bottom: 20px; font-size: 13px;">Tạo tài khoản người mua để lưu địa chỉ, theo dõi đơn và đặt bánh theo yêu cầu (FR-01).</p>
      <form class="t3-form" action="m5-3.html" method="GET">
        <div class="form-group">
          <label for="reg-email">Email của bạn *</label>
          <input type="email" id="reg-email" value="anh.minh@congty.com" required>
        </div>
        <div class="form-group">
          <label for="reg-pass">Mật khẩu *</label>
          <input type="password" id="reg-pass" value="••••••••" required>
        </div>
        <div class="form-group">
          <label for="reg-pass2">Nhập lại mật khẩu *</label>
          <input type="password" id="reg-pass2" value="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="padding: 10px; font-size: 15px; margin-top: 8px;">
          Tiếp tục: Xác nhận mã OTP (M5.3) ›
        </button>
      </form>
      <div style="margin-top: 16px; font-size: 13px; text-align: center;">
        Đã có tài khoản? <a href="m5-1.html">Đăng nhập tại đây</a>
      </div>
    </div>
  </main>

  <aside class="wf-note" data-ref="FR-01">
    Đăng ký (M5.2). Demo chỉ xác thực qua email (A-17, FR-01). Sau khi điền email chuyển sang M5.3 để xác nhận.
  </aside>

  <script src="../assets/data.js"></script>
  <script src="../assets/wf.js"></script>
</body>
</html>
