<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonkage – Thêm / sửa địa chỉ (M6.3.1)</title>
  <link rel="stylesheet" href="../assets/wf.css">
</head>
<body data-zone="M" data-page="M6.3.1">
  <main id="content">
    <div class="page-head"><div><h1>Thêm địa chỉ</h1></div></div>
    <form class="form" action="m6-3.html" method="get">
      <fieldset data-why="1">
        <legend>Người nhận</legend>
        <div class="field-row">
          <div class="field"><label for="n" class="req">Họ tên</label><input id="n" type="text" value="Anh Minh" class="w-name"></div>
          <div class="field fit"><label for="p" class="req">Số điện thoại</label><input id="p" type="tel" value="0912 345 678" class="w-phone"></div>
        </div>
      </fieldset>
      <fieldset data-why="2">
        <legend>Địa chỉ</legend>
        <div class="field"><label for="c" class="req">Tỉnh / thành phố</label><select id="c"><option>Hà Nội</option><option>TP. Hồ Chí Minh</option><option>Đà Nẵng</option></select></div>
        <div class="field"><label for="d" class="req">Số nhà, đường, phường</label><input id="d" type="text" value="18 Hoàng Diệu, Ba Đình"></div>
        <div class="field"><label for="t">Tên gợi nhớ</label><input id="t" type="text" value="Nhà"><span class="hint">Hiện khi chọn địa chỉ ở thanh toán</span></div>
        <label class="check mt-2"><input type="checkbox" checked> Đặt làm địa chỉ mặc định</label>
      </fieldset>
      <div class="form-actions" data-why="3"><a href="m6-3.html" class="btn btn-ghost">Hủy</a><button type="submit" class="btn btn-primary btn-lg">Lưu địa chỉ</button></div>
    </form>
  </main>

  <aside class="wf-note" data-ref="FR-03">Form thêm hoặc sửa địa chỉ.</aside>
  <script src="../assets/data.js"></script>
  <script src="../assets/why-m.js"></script>
  <script src="../assets/wf.js"></script>
</body>
</html>
