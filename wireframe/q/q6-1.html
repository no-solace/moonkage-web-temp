<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonkage – Phí giao liên tỉnh (Q6.1)</title>
  <link rel="stylesheet" href="../assets/wf.css">
</head>
<body data-zone="Q" data-page="Q6.1">
  <main id="content">
    <h1>Cấu hình phí giao hàng liên tỉnh (Q6.1)</h1>
    <p style="color: #444; margin-bottom: 20px;">Bắt buộc phải cấu hình đủ 63 tỉnh/thành; hệ thống sẽ chặn lưu nếu thiếu tỉnh (AC-52.3).</p>
    <form class="t3-form" action="q6-0.html" method="GET">
      <fieldset>
        <legend>Biểu phí theo vùng miền</legend>
        <div class="form-group">
          <label for="fee-north">Tuyến liên tỉnh Miền Bắc (VNĐ) *</label>
          <input type="number" id="fee-north" value="35000" step="5000" required>
        </div>
        <div class="form-group">
          <label for="fee-central">Tuyến Miền Trung (VNĐ) *</label>
          <input type="number" id="fee-central" value="45000" step="5000" required>
        </div>
        <div class="form-group">
          <label for="fee-south">Tuyến Miền Nam (VNĐ) *</label>
          <input type="number" id="fee-south" value="50000" step="5000" required>
        </div>
        <div class="form-group">
          <label><input type="checkbox" checked disabled> Đã kiểm tra đủ 63/63 tỉnh thành (AC-52.3)</label>
        </div>
      </fieldset>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button type="submit" class="btn btn-primary" style="padding: 10px 20px;">Lưu cấu hình cước (Q6.0) ›</button>
        <a href="q6-0.html" class="btn">Hủy</a>
      </div>
    </form>
  </main>

  <aside class="wf-note" data-ref="AC-52.3">
    Phí giao liên tỉnh (Q6.1). Không cho lưu khi thiếu tỉnh theo quy định bắt buộc AC-52.3 (FR-52).
  </aside>

  <script src="../assets/data.js"></script>
  <script src="../assets/wf.js"></script>
</body>
</html>
